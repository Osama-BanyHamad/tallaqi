components:
  schemas:
    AccountOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        locale:
          type: string
      required:
      - email
      - full_name
      - id
      - locale
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        membership:
          type: string
          format: uuid
        role:
          type: string
          format: uuid
        role_key:
          type: string
          readOnly: true
        account_email:
          type: string
          format: email
          readOnly: true
        scope_type:
          $ref: '#/components/schemas/ScopeTypeEnum'
        scope_refs: {}
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true
      required:
      - account_email
      - id
      - membership
      - role
      - role_key
    AssignmentRequest:
      type: object
      properties:
        membership:
          type: string
          format: uuid
        role:
          type: string
          format: uuid
        scope_type:
          $ref: '#/components/schemas/ScopeTypeEnum'
        scope_refs: {}
        valid_from:
          type: string
          format: date
          nullable: true
        valid_to:
          type: string
          format: date
          nullable: true
      required:
      - membership
      - role
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 20
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 8
        address: {}
        gender_policy:
          type: string
          maxLength: 12
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        name_en:
          type: string
          maxLength: 200
        code:
          type: string
          maxLength: 20
        timezone:
          type: string
          maxLength: 64
        locale:
          type: string
          maxLength: 8
        address: {}
        gender_policy:
          type: string
          minLength: 1
          maxLength: 12
        is_active:
          type: boolean
      required:
      - name
    Halaqah:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        branch:
          type: string
          format: uuid
        branch_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 120
        kind:
          $ref: '#/components/schemas/KindEnum'
        gender_policy:
          type: string
          maxLength: 8
        capacity:
          type: integer
          maximum: 32767
          minimum: 0
        riwayah:
          type: string
          maxLength: 32
        mushaf_type:
          type: string
          maxLength: 32
        policy_key:
          type: string
          maxLength: 40
        schedule_summary:
          type: string
          maxLength: 200
        status:
          type: string
          maxLength: 12
        teachers:
          type: string
          readOnly: true
        student_count:
          type: string
          readOnly: true
      required:
      - branch
      - branch_name
      - id
      - name
      - student_count
      - teachers
    HalaqahRequest:
      type: object
      properties:
        branch:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          $ref: '#/components/schemas/KindEnum'
        gender_policy:
          type: string
          minLength: 1
          maxLength: 8
        capacity:
          type: integer
          maximum: 32767
          minimum: 0
        riwayah:
          type: string
          minLength: 1
          maxLength: 32
        mushaf_type:
          type: string
          minLength: 1
          maxLength: 32
        policy_key:
          type: string
          minLength: 1
          maxLength: 40
        schedule_summary:
          type: string
          maxLength: 200
        status:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - branch
      - name
    Journey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        student:
          type: string
          format: uuid
          readOnly: true
        student_name:
          type: string
          readOnly: true
        student_code:
          type: string
          readOnly: true
        riwayah:
          type: string
          maxLength: 32
        mushaf_type:
          type: string
          maxLength: 32
        policy_key:
          type: string
          maxLength: 40
        policy_overrides: {}
        status:
          $ref: '#/components/schemas/JourneyStatusEnum'
        started_at:
          type: string
          format: date
        direction:
          type: string
          maxLength: 12
        current_ayah_index:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        current_key:
          type: string
          readOnly: true
        level:
          type: string
          maxLength: 40
        memorized_ayat:
          type: integer
          readOnly: true
        strong_ayat:
          type: integer
          readOnly: true
        needs_revision_ayat:
          type: integer
          readOnly: true
        weak_ayat:
          type: integer
          readOnly: true
        critical_ayat:
          type: integer
          readOnly: true
        mastered_ayat:
          type: integer
          readOnly: true
        avg_retention:
          type: number
          format: double
          readOnly: true
        memorized_pages:
          type: string
          readOnly: true
        memorized_pages_order:
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avg_retention
      - critical_ayat
      - current_key
      - id
      - mastered_ayat
      - memorized_ayat
      - memorized_pages
      - memorized_pages_order
      - needs_revision_ayat
      - started_at
      - strong_ayat
      - student
      - student_code
      - student_name
      - updated_at
      - weak_ayat
    JourneyRequest:
      type: object
      properties:
        riwayah:
          type: string
          minLength: 1
          maxLength: 32
        mushaf_type:
          type: string
          minLength: 1
          maxLength: 32
        policy_key:
          type: string
          minLength: 1
          maxLength: 40
        policy_overrides: {}
        status:
          $ref: '#/components/schemas/JourneyStatusEnum'
        started_at:
          type: string
          format: date
        direction:
          type: string
          minLength: 1
          maxLength: 12
        current_ayah_index:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        level:
          type: string
          maxLength: 40
      required:
      - started_at
    JourneyStatusEnum:
      enum:
      - memorizing
      - retaining
      - paused
      - completed_with_retention
      - ijazah_track
      type: string
      description: |-
        * `memorizing` - في الحفظ
        * `retaining` - في المراجعة الطويلة
        * `paused` - متوقف
        * `completed_with_retention` - أتمّ الختم
        * `ijazah_track` - مسار الإجازة
    KindEnum:
      enum:
      - in_person
      - online
      - hybrid
      type: string
      description: |-
        * `in_person` - حضوري
        * `online` - عن بُعد
        * `hybrid` - مدمج
    LoginOut:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        account:
          $ref: '#/components/schemas/AccountOut'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/MembershipOut'
      required:
      - access
      - account
      - memberships
      - refresh
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    MembershipOut:
      type: object
      properties:
        tenant_slug:
          type: string
        tenant_name:
          type: string
        tenant_kind:
