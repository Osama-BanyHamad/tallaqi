name: talaqqi
description: Talaqqi — student, teacher, and parent app for the Quran learning journey (Arabic-first).
publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.20.3
  record: ^7.1.1
  path_provider: ^2.1.6
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
