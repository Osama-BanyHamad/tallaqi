name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: postgres://talaqqi_app:talaqqi_dev@localhost:5432/talaqqi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - name: Create non-superuser app role (RLS must apply to it)
        run: PGPASSWORD=postgres psql -h localhost -U postgres -f infra/scripts/init-db.sql
      - run: ruff check .
      - run: lint-imports
      - name: Quran Core integrity (fails on any text change without a reviewed release)
        run: python -m pytest packages/quran_core -q -p no:django -o addopts=""
      - run: python -m pytest -q --create-db

  quran-core-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Block Quran text changes unless labeled quran-core-release
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^packages/quran_core/data/'; then
            echo "::error::Quran Core data changed. This PR must carry the 'quran-core-release' label and two reviewer approvals."
            echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q quran-core-release || exit 1
          fi
